services:
  siouxdb:
    image: mysql:8.0
    container_name: tp_sioux_db
    restart: unless-stopped
    hostname: siouxdb
    networks:
      - core-network
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sioux_platform
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - sioux_db_data:/var/lib/mysql
    ports:
      - "3310:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-pBenchMark123" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

